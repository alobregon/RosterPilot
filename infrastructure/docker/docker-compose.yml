services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rosterpilot
      POSTGRES_PASSWORD: rosterpilot
      POSTGRES_DB: rosterpilot
    ports:
      - "5432:5432"
    volumes:
      - rosterpilot_postgres:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  rosterpilot_postgres:
